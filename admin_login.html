{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}
{% block content %}
<div class="login card">
  <h1>管理员登录</h1>
  <p>仅限授权管理员使用。</p>
  <form method="post">
    <label>用户名<input name="username" required></label>
    <label>密码<input name="password" type="password" required></label>
    <button class="primary" type="submit">登录</button>
  </form>
</div>
{% endblock %}
