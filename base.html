<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}易县第三中学 · 表白墙{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap nav">
    <a class="brand" href="{{ url_for('index') }}">💌 易县三中表白墙</a>
    <a class="admin-link" href="{{ url_for('admin_login') }}">管理后台</a>
  </div>
</header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>文明交流 · 理性表达 · 请勿发布个人隐私或不当内容</footer>
</body>
</html>
